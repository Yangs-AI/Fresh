name: Deploy Fresh

on:
  push:
    branches:
      - main
    paths:
      - "FreshDocs/**"
      - "Tools/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Fresh
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FreshDocs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FreshDocs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run statistics
        run: npm run statistics

      - name: Build website
        run: npm run build

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ARGS: "-avz --delete"
          SOURCE: "./FreshDocs/build/"
          REMOTE_HOST: ${{ secrets.HOST }}
          REMOTE_PORT: ${{ secrets.PORT }}
          REMOTE_USER: ${{ secrets.USER }}
          TARGET: ${{ secrets.TARGET_PUBLIC }}
